<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>THE BOSS - Sem conexão</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #000; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .box { text-align: center; max-width: 420px; padding: 24px; }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 2px; }
    h1 span { color: #ef4444; }
    p { color: #aaa; line-height: 1.5; }
    button { margin-top: 16px; background: #ef4444; color: #fff; border: 0; border-radius: 8px;
             padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="box">
    <h1>THE <span>BOSS</span></h1>
    <p>Não foi possível conectar ao sistema.<br />Verifique sua internet e tente novamente.</p>
    <button id="retry">Tentar novamente</button>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get('retry') || 'https://thebosspro.com/';
    document.getElementById('retry').addEventListener('click', () => { location.href = target; });
    window.addEventListener('online', () => { location.href = target; });
  </script>
</body>
</html>
