name: Build Desktop (Windows + macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: release/*.exe
            name: instalador-windows
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
            name: instalador-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar instalador
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # Sem certificado Apple: o .dmg sai sem assinatura
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Ler versão do app
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Cada versão nova (campo "version" do package.json) vira uma página de download pública
      - name: Publicar na página de Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: THE BOSS ERP ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** baixe o arquivo `.exe` e execute. Se aparecer "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo**.

            **macOS:** baixe o arquivo `.dmg`, abra e arraste o THE BOSS ERP para **Aplicativos**. Na primeira vez, clique com o botão direito no app → **Abrir**.

            Atualizar por cima de uma versão anterior mantém todos os dados.
          files: ${{ matrix.files }}
